<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Portal Clientes EN1 — Galenus</title>
  <link rel="stylesheet" href="../css/portal.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <img class="logo" src="../assets/logoGalenus9.png" alt="Galenus Panamá" />
      <h1>Portal Clientes</h1>
      <p>Acceso seguro vía EasyNodeOne Platform (EN1).</p>

      <form action="index.html" method="get">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="nombre@institucion.com" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div class="login-actions">
          <button class="btn btn-primary" type="submit" style="width:100%">Ingresar</button>
          <a class="btn btn-outline" href="#" style="width:100%">Recuperar acceso</a>
        </div>
      </form>

      <div class="login-soon">
        <strong>Etapas 1–3:</strong> esta pantalla puede mostrarse como “Próximamente” con CTA a cotizar.
        <strong>Etapa 4:</strong> autenticación real EN1 (mismo layout).
      </div>

      <div class="login-foot">
        <a href="../index.html">← Volver al sitio</a>
        ·
        <a href="https://appdev.easynodeone.com/login?next=/services">Cotizar sin cuenta</a>
      </div>
    </div>
  </main>
</body>
</html>
