{% extends "base.html" %}
{% block title %}Ajuste — Inventario{% endblock %}
{% block page_content %}
<div class="container-fluid px-2 px-sm-3 py-2 erp-compact-page" style="max-width:28rem">
  <h1 class="h5 mb-3">Ajuste</h1>
  <form method="post" class="vstack gap-2">
    <div>
      <label class="form-label small mb-0">Almacén</label>
      <select name="warehouse_id" class="form-select form-select-sm" required>
        {% for w in warehouses %}
        <option value="{{ w.id }}">{{ w.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label small mb-0">SKU *</label>
      <input name="product_ref" class="form-control form-control-sm" required>
    </div>
    <div>
      <label class="form-label small mb-0">Sentido</label>
      <select name="direction" class="form-select form-select-sm">
        <option value="out">Salida (−)</option>
        <option value="in">Entrada (+)</option>
      </select>
    </div>
    <div>
      <label class="form-label small mb-0">Cantidad *</label>
      <input name="quantity" type="number" step="0.0001" min="0.0001" class="form-control form-control-sm" required>
    </div>
    <div>
      <label class="form-label small mb-0">Motivo *</label>
      <select name="reason" class="form-select form-select-sm" required>
        {% for r in reasons %}
        <option value="{{ r }}">{{ r }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label small mb-0">Notas</label>
      <input name="notes" class="form-control form-control-sm">
    </div>
    <button class="btn btn-sm btn-primary" type="submit">Registrar ajuste</button>
    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('en1_inventory.inventory_balances') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
