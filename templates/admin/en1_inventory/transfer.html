{% extends "base.html" %}
{% block title %}Transferencia — Inventario{% endblock %}
{% block page_content %}
<div class="container-fluid px-2 px-md-3 py-2 erp-compact-page en1-inv-fullwidth" style="max-width:42rem">
  <h1 class="h5 mb-3">Transferencia entre almacenes</h1>
  {% if warehouses|length < 2 %}
  <p class="text-muted small">Necesitás al menos 2 almacenes. Creá uno en <a href="{{ url_for('en1_inventory.inventory_warehouses') }}">Almacenes</a>.</p>
  {% endif %}
  <form method="post" class="vstack gap-2">
    <div>
      <label class="form-label small mb-0">Desde *</label>
      <select name="from_warehouse_id" class="form-select form-select-sm" required>
        {% for w in warehouses %}
        <option value="{{ w.id }}">{{ w.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label small mb-0">Hacia *</label>
      <select name="to_warehouse_id" class="form-select form-select-sm" required>
        {% for w in warehouses %}
        <option value="{{ w.id }}" {% if loop.index0 == 1 %}selected{% endif %}>{{ w.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label small mb-0">SKU *</label>
      <input name="product_ref" class="form-control form-control-sm" required>
    </div>
    <div>
      <label class="form-label small mb-0">Cantidad *</label>
      <input name="quantity" type="number" step="0.0001" min="0.0001" class="form-control form-control-sm" required>
    </div>
    <div>
      <label class="form-label small mb-0">Notas</label>
      <input name="notes" class="form-control form-control-sm">
    </div>
    <button class="btn btn-sm btn-primary" type="submit" {% if warehouses|length < 2 %}disabled{% endif %}>Transferir</button>
    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('en1_inventory.inventory_balances') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
