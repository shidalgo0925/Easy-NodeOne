{% extends "base.html" %}
{% block title %}Almacenes — Inventario{% endblock %}
{% block page_content %}
<div class="container-fluid px-2 px-md-3 py-2 erp-compact-page en1-inv-fullwidth">
  <h1 class="h5 mb-3">Almacenes</h1>
  <div class="table-responsive mb-3">
    <table class="table table-sm table-bordered">
      <thead class="table-light"><tr><th>Ref</th><th>Nombre</th><th>Estado</th></tr></thead>
      <tbody>
        {% for w in warehouses %}
        <tr><td><code>{{ w.unit_ref }}</code></td><td>{{ w.name }}</td><td>{{ w.status }}</td></tr>
        {% else %}
        <tr><td colspan="3" class="text-muted">Sin almacenes.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <form method="post" class="row g-2 align-items-end mb-3" style="max-width:28rem">
    <div class="col-5">
      <label class="form-label small mb-0">Ref *</label>
      <input name="unit_ref" class="form-control form-control-sm" required maxlength="64" placeholder="sucursal-2">
    </div>
    <div class="col-5">
      <label class="form-label small mb-0">Nombre *</label>
      <input name="name" class="form-control form-control-sm" required maxlength="200" placeholder="Almacén sucursal">
    </div>
    <div class="col-2"><button class="btn btn-sm btn-primary w-100" type="submit">Crear</button></div>
  </form>
  <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('en1_inventory.inventory_balances') }}">Volver</a>
</div>
{% endblock %}
