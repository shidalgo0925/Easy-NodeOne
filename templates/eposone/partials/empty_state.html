{# EPosOne DS — empty state
   title, text?, icon?=fa-inbox, action_url?, action_label?, compact?=false #}
<div class="epos-empty{% if compact %} epos-empty--compact{% endif %}">
    <div class="epos-empty__icon" aria-hidden="true">
        <i class="fas {{ icon|default('fa-inbox') }}"></i>
    </div>
    <p class="epos-empty__title">{{ title }}</p>
    {% if text %}<p class="epos-empty__text">{{ text }}</p>{% endif %}
    {% if action_url and action_label %}
    <div class="mt-3">
        <a href="{{ action_url }}" class="btn btn-sm btn-outline-primary">{{ action_label }}</a>
    </div>
    {% endif %}
</div>
