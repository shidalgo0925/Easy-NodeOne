{% extends "base.html" %}

{% block title %}EPosOne — {{ section_title }} | {{ get_nav_brand_name() }}{% endblock %}

{% block page_content %}
<div class="container-fluid py-3 en1-eposone-page">
    <div class="mb-3">
        <h1 class="h4 mb-1 app-page-title">{{ section_title }}</h1>
        <p class="text-muted small mb-0">{{ section_description }}</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white">
                    <strong>Parámetros operativos</strong>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('eposone.eposone_settings_save') }}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold" for="default_currency">Moneda por defecto</label>
                            <select class="form-select form-select-sm" id="default_currency" name="default_currency" required>
                                {% for cur in allowed_currencies %}
                                <option value="{{ cur }}" {% if settings and settings.default_currency == cur %}selected{% endif %}>{{ cur }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="kds_auto_enqueue" name="kds_auto_enqueue" value="1"
                                   {% if not settings or settings.kds_auto_enqueue %}checked{% endif %}>
                            <label class="form-check-label small" for="kds_auto_enqueue">
                                Encolar tickets KDS al confirmar pedido
                            </label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="delivery_auto_create" name="delivery_auto_create" value="1"
                                   {% if not settings or settings.delivery_auto_create %}checked{% endif %}>
                            <label class="form-check-label small" for="delivery_auto_create">
                                Crear entrega automática cuando el pedido queda <code>ready</code>
                            </label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="fiscal_on_payment" name="fiscal_on_payment" value="1"
                                   {% if settings and settings.fiscal_on_payment %}checked{% endif %}>
                            <label class="form-check-label small" for="fiscal_on_payment">
                                Solicitar emisión fiscal al completar el cobro
                            </label>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="supervisor_approval_required" name="supervisor_approval_required" value="1"
                                   {% if not settings or settings.supervisor_approval_required %}checked{% endif %}>
                            <label class="form-check-label small" for="supervisor_approval_required">
                                Requerir supervisor en reembolsos y movimientos manuales de caja
                            </label>
                        </div>

                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="fas fa-save me-1"></i> Guardar configuración
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-muted small mt-3 mb-0">
                También disponible vía API: <code>GET/PATCH /api/eposone/settings</code>
            </p>
        </div>
    </div>
</div>
{% endblock %}
