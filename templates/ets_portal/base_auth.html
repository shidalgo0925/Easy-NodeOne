<!DOCTYPE html>
<html lang="es" data-theme="light" data-brand="portal" data-product="portal" data-surface="portal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ brand_name|default(get_nav_brand_name()) }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename=get_nav_logo()) }}?v={{ get_nav_logo_cache_key() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ets-portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-login.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #0f4c81;
            --color-accent: #0ea5e9;
            --color-border: #e2e8f0;
            --auth-cta: #0f4c81;
            --auth-accent: #0ea5e9;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="ets-portal ets-portal--auth auth-fullbleed">
    <main class="ets-portal-main ets-portal-main--auth">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="ets-portal-flashes">
            {% for category, message in messages %}
            <div class="ets-portal-flash ets-portal-flash--{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
