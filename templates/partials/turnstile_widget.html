{# Cloudflare Turnstile — integrado en el flujo de auth #}
{% if turnstile_enabled and turnstile_site_key %}
<div class="auth-gate__verify">
    <span class="auth-gate__verify-label">Verificación de seguridad</span>
    <div class="auth-turnstile">
        <div class="cf-turnstile"
             data-sitekey="{{ turnstile_site_key }}"
             data-theme="light"
             data-size="normal"></div>
    </div>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
